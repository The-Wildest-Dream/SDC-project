name: Build and publish RunPod price worker

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/build-myr-image.yml"
      - "price_model.py"
      - "models/historical_price/model.joblib"
      - "models/historical_price/evaluation.json"
      - "runpod/Dockerfile"
      - "runpod/handler.py"
      - "runpod/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_SHA: ghcr.io/the-wildest-dream/sdc-project-runpod:sha-${{ github.sha }}
      IMAGE_LATEST: ghcr.io/the-wildest-dream/sdc-project-runpod:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file runpod/Dockerfile \
            --tag "$IMAGE_SHA" \
            .

      - name: Check image contents and CNY/MYR inference before publishing
        run: |
          docker run --rm -i --network none --entrypoint python "$IMAGE_SHA" - <<'PY'
          from pathlib import Path
          import re
          import sys

          app_root = Path("/app")
          allowed_files = {
              "price_model.py",
              "models/historical_price/model.joblib",
              "models/historical_price/evaluation.json",
              "runpod/handler.py",
              "runpod/requirements.txt",
          }
          actual_files = {
              path.relative_to(app_root).as_posix()
              for path in app_root.rglob("*")
              if path.is_file()
          }
          if actual_files != allowed_files:
              missing = sorted(allowed_files - actual_files)
              unexpected = sorted(actual_files - allowed_files)
              raise SystemExit(
                  f"Image file allowlist failed; missing={missing}, unexpected={unexpected}"
              )

          secret_patterns = (
              re.compile(rb"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----"),
              re.compile(rb"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b"),
              re.compile(
                  rb"(?i)(?:RUNPOD_API_KEY|DATABASE_URL)\s*=\s*[\"'][^\"'\n]{8,}[\"']"
              ),
          )
          for relative_path in sorted(allowed_files):
              content = (app_root / relative_path).read_bytes()
              if any(pattern.search(content) for pattern in secret_patterns):
                  raise SystemExit(
                      f"Potential credential pattern found in image file: {relative_path}"
                  )

          sys.path.insert(0, "/app/runpod")
          from handler import handler

          samples = (
              (
                  "CNY",
                  {
                      "product": "P001",
                      "currency": "CNY",
                      "unit": "件",
                      "quantity": 100,
                      "cost": 50,
                      "day": "2026-10-23",
                  },
              ),
              (
                  "MYR",
                  {
                      "product": "P_MY_001",
                      "currency": "MYR",
                      "unit": "件",
                      "quantity": 100,
                      "cost": 22.1,
                      "day": "2026-10-23",
                  },
              ),
          )
          for currency, payload in samples:
              result = handler({"input": payload})
              if result.get("prediction_status") != "available":
                  raise SystemExit(f"{currency} container inference check failed")
              if not isinstance(result.get("prediction"), (int, float)):
                  raise SystemExit(f"{currency} container prediction is not numeric")
          print("Image allowlist, credential-pattern scan, CNY inference, and MYR inference passed.")
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and latest tags
        run: |
          docker push "$IMAGE_SHA"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_LATEST"
          {
            echo "Published image:"
            echo "- \`$IMAGE_SHA\`"
            echo "- \`$IMAGE_LATEST\`"
            echo
            echo "The image passed the pre-publish content allowlist and CNY/MYR inference checks."
          } >> "$GITHUB_STEP_SUMMARY"
